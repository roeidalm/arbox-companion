# Arbox Dashboard — Lovelace YAML
# Legacy optional dashboard. The recommended UI is the automatically installed
# Arbox sidebar panel (integration 3.0.0+). See arbox-panel.md.
# ייבוא: Settings → Dashboards → Add Dashboard → Manual → העתק תכולה
#
# הלוח המלא (פילטרים, הזמנה בלחיצה) הוא ה-UI של arbox-server — הכרטיס
# האחרון מטמיע אותו. שאר הכרטיסים הם ה-entities של האינטגרציה.

title: Arbox
views:
  - title: ארבוקס
    icon: mdi:run
    cards:
      - type: markdown
        title: השיעור הבא
        content: |
          {% set n = state_attr('sensor.arbox_next_class', 'schedule_id') %}
          {% if n %}
          ## {{ state_attr('sensor.arbox_next_class', 'category') }}
          {% if state_attr('sensor.arbox_next_class', 'coach') %}
          **{{ state_attr('sensor.arbox_next_class', 'coach') }}**
          {% endif %}

          🗓️ {{ state_attr('sensor.arbox_next_class', 'date') }} ·
          🕐 {{ state_attr('sensor.arbox_next_class', 'start_time') }}–{{ state_attr('sensor.arbox_next_class', 'end_time') }}

          ⏳ בעוד {{ relative_time(states('sensor.arbox_next_class') | as_datetime | as_local) }}

          👥 {{ state_attr('sensor.arbox_next_class', 'registered') }}/{{ state_attr('sensor.arbox_next_class', 'max') }} רשומים
          {% if state_attr('sensor.arbox_next_class', 'user_in_standby') %}
          · 🟡 את/ה בהמתנה (מקום {{ state_attr('sensor.arbox_next_class', 'stand_by_position') }})
          {% else %}
          · 🔵 את/ה רשומ/ה
          {% endif %}
          {% else %}
          אין שיעור קרוב שאת/ה רשומ/ה אליו.
          {% endif %}

      - type: entities
        title: פעולות
        show_header_toggle: false
        entities:
          - entity: button.arbox_cancel_next_class
            name: בטל את השיעור הבא
          - entity: button.arbox_refresh_schedule
            name: רענן מול Arbox
          - type: divider
          - entity: sensor.arbox_membership
            name: מנוי
          - entity: sensor.arbox_booked_classes
            name: שיעורים רשומים

      - type: markdown
        title: כל ההרשמות שלי
        content: |
          {% set rows = state_attr('sensor.arbox_booked_classes', 'summary') or [] %}
          {% if rows %}
          {% for r in rows %}
          - {{ r }}
          {% endfor %}
          {% else %}
          אין שיעורים רשומים כרגע
          {% endif %}

          _עודכן: {{ state_attr('sensor.arbox_booked_classes', 'last_sync') }}_

      - type: calendar
        title: לוח השיעורים
        entities:
          - calendar.arbox_schedule
        initial_view: listWeek

      # ה-UI המלא של השרת (החלף את הכתובת לכתובת שלך)
      - type: iframe
        url: "http://YOUR-HOST:8177"
        aspect_ratio: 100%
