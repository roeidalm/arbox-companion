views:
  # The app itself gets its own panel view: an iframe with a fixed aspect
  # ratio inside a column is a small square with its own scrollbar, which is
  # why the embedded UI looked cramped. panel:true gives it the full window.
  - title: ארבוקס
    path: arbox
    icon: mdi:run
    cards:
      - type: markdown
        title: השיעור הבא
        content: |
          {% set s = 'sensor.arbox_next_class' %}
          {% set ts = states(s) %}
          {% if ts not in ['unknown', 'unavailable', 'none', ''] %}
          ## {{ state_attr(s, 'category') }}
          {{ state_attr(s, 'coach') or '' }}

          🗓️ {{ state_attr(s, 'date') }} · 🕐 {{ state_attr(s, 'start_time') }}–{{ state_attr(s, 'end_time') }}
          ⏳ בעוד {{ time_until(ts | as_datetime) }}
          👥 {{ state_attr(s, 'registered') }}/{{ state_attr(s, 'max') }} רשומים{% if state_attr(s, 'user_in_standby') %} · 🟡 בהמתנה (מקום {{ state_attr(s, 'stand_by_position') }}){% else %} · 🔵 רשומ/ה{% endif %}
          {% else %}
          אין שיעור קרוב שאת/ה רשומ/ה אליו.
          {% endif %}

      - type: entities
        title: מצב
        show_header_toggle: false
        entities:
          - entity: button.arbox_refresh_schedule
            name: רענן מול Arbox
          - type: divider
          - entity: sensor.arbox_membership
            name: מנוי
          - entity: sensor.arbox_booked_classes
            name: שיעורים רשומים

      # Deliberately absent: button.arbox_cancel_next_class. It cancels on
      # press with no way back, and a dashboard is somewhere you glance and
      # tap — a confirmation dialog only softens that, it does not justify
      # putting an irreversible control among status readouts.
      #
      # In its place, a link. Cancelling should mean arriving somewhere that
      # names the class, shows who teaches it and when, and asks before it
      # acts — not hitting a control that fires on contact.
      - type: button
        name: לניהול ההרשמות
        icon: mdi:open-in-new
        show_state: false
        tap_action:
          action: url
          url_path: http://YOUR-HOST:8177/mine

      - type: markdown
        title: כל ההרשמות שלי
        content: |
          {% set rows = state_attr('sensor.arbox_booked_classes', 'summary') or [] %}
          {% if rows %}
          {% for r in rows %}
          - {{ r }}
          {% endfor %}
          {% else %}
          אין שיעורים רשומים כרגע
          {% endif %}

          {% set ls = state_attr('sensor.arbox_booked_classes', 'last_sync') %}
          {% if ls %}_עודכן {{ time_since(ls | as_datetime | as_local) }} לפני_{% endif %}

      - type: calendar
        title: לוח השיעורים
        entities:
          - calendar.arbox_schedule
        initial_view: listWeek

  - title: אפליקציה
    path: arbox-app
    icon: mdi:calendar-check
    panel: true
    cards:
      - type: iframe
        url: http://YOUR-HOST:8177/
